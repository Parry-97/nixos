# ~/.config/tmux/tmux.conf — out-of-store symlink to this file (editable live).
# Reload with: <prefix>r  (prefix = C-a)
#
# Plugin binaries are delivered by Home Manager into ~/.config/tmux/plugins.conf
# (store-managed, sourced at the bottom of this file). Edit this file freely.

# --- Core -------------------------------------------------------------------
setw -g mouse on
set -g focus-events on
set -g escape-time 0
set -g history-limit 50000
set -g repeat-time 300
set -s extended-keys on

# True color through the terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",*:Tc"
set -g set-clipboard on

# --- Prefix: C-a ------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind a send-prefix
bind C-a send-prefix

# --- Vim-style pane navigation (prefix) -------------------------------------
# Ctrl+hjkl passthrough to nvim is handled by vim-tmux-navigator (plugins.conf)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Resize (repeatable) ----------------------------------------------------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Splits -----------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# --- Panes ------------------------------------------------------------------
bind o rotate-window
bind z resize-pane -Z
bind < swap-pane -U
bind > swap-pane -D
bind -n C-Tab next-window    # hint: some terminals pass this
bind -n M-Right next-window
bind -n M-Left previous-window

# --- Windows ----------------------------------------------------------------
bind n next-window
bind p previous-window
bind Tab last-window
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# --- Copy mode (vi) ---------------------------------------------------------
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind p previous-window
bind P previous-window
bind b choose-buffer -Z

# --- Reload -----------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# --- Resurrect / Continuum settings -----------------------------------------
set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-strategy-nvim "session"
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"
set -g @yank-selection "clipboard"

# --- Status line ------------------------------------------------------------
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=default,fg=white"
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[fg=cyan,bold] #S "
set -g status-right "#{?window_zoomed_flag,#[fg=yellow]Z ,}#[fg=white]#{pane_current_path} #[fg=cyan]%H:%M "
set -g window-status-format "#[fg=white] #I:#W#[fg=white] "
set -g window-status-current-format "#[fg=green,bold] #I:#W "
set -g window-status-separator ""
setw -g automatic-rename on
setw -g window-status-current-style "bg=default"
setw -g window-status-style "bg=default"

# --- Plugins (Home Manager generated; loads last) ---------------------------
if-shell "test -f ~/.config/tmux/plugins.conf" "source-file ~/.config/tmux/plugins.conf"
